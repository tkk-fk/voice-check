<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>じぶんの こえを きく｜はけいで かくにん</title>
<meta name="description" content="自分の声を録音してはけいで見て、再生で客観的に聴ける特別支援教材。データは端末の外に出ない完全オフライン。発音の練習に。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7F1E3; --ink:#4A3F35; --ink-soft:#7A6C5D;
    --card:#FFFDF7; --line:#E5DAC4; --pad:#FBF6EA;
    --f2:#EE9B3A; --f2d:#C87718; --ok:#6BBF59; --okd:#4E9E3E; --r:18px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{font-family:"Zen Maru Gothic","BIZ UDPGothic",sans-serif;background:var(--bg);color:var(--ink);min-height:100dvh;
    padding:calc(env(safe-area-inset-top) + .6rem) calc(env(safe-area-inset-right) + .7rem)
            calc(env(safe-area-inset-bottom) + 1rem) calc(env(safe-area-inset-left) + .7rem);}
  .wrap{max-width:720px;margin:0 auto;}
  header{text-align:center;margin-bottom:.5rem;}
  h1{font-size:clamp(1.15rem,4.6vw,1.55rem);margin:.2rem 0 .1rem;}
  .sub{font-size:clamp(.72rem,2.7vw,.9rem);color:var(--ink-soft);margin:0;}

  .steps{display:flex;justify-content:center;gap:.4rem;flex-wrap:wrap;margin:.5rem 0 .3rem;font-size:clamp(.68rem,2.5vw,.8rem);color:var(--ink-soft);}
  .steps b{color:var(--f2d);}

  .scopewrap{position:relative;background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:.5rem;}
  canvas{width:100%;height:clamp(220px,42vh,340px);display:block;border-radius:12px;background:var(--pad);}
  .overlay{position:absolute;inset:.5rem;border-radius:12px;background:rgba(251,246,234,.94);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.7rem;text-align:center;padding:1rem;}
  .overlay p{margin:0;font-size:clamp(.8rem,3vw,.98rem);color:var(--ink-soft);line-height:1.6;}
  .start{border:none;border-radius:16px;background:var(--f2);color:#7A4A16;font-family:inherit;font-weight:700;
    font-size:clamp(1rem,3.6vw,1.2rem);padding:.7rem 1.4rem;box-shadow:0 4px 0 var(--f2d);cursor:pointer;}
  .start:active{transform:translateY(3px);box-shadow:0 1px 0 var(--f2d);}
  .hidden{display:none !important;} .err{color:#B4472B;font-weight:700;}

  .row{display:flex;align-items:center;gap:.9rem;flex-wrap:wrap;justify-content:center;margin:.8rem 0 0;}
  .btn{border:none;border-radius:16px;font-family:inherit;font-weight:700;font-size:clamp(.95rem,3.6vw,1.15rem);padding:.65rem 1.4rem;cursor:pointer;}
  .btn.rec{background:#F2C0B4;color:#8A3A22;box-shadow:0 4px 0 #DB8E7C;}
  .btn.play{background:#B7DFA6;color:#2E5E23;box-shadow:0 4px 0 #7FB56C;}
  .btn.again{background:#EBD9B6;color:#7A5A22;box-shadow:0 4px 0 #D3B77F;}
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 currentColor;}
  .reclab{display:inline-flex;align-items:center;gap:.4rem;font-weight:700;color:#B4472B;font-size:clamp(.85rem,3vw,1rem);}
  .recdot{width:.85rem;height:.85rem;border-radius:50%;background:#D9463B;animation:blink 1s infinite;}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

  .speed{display:inline-flex;align-items:center;gap:.5rem;}
  .speed label{font-weight:700;font-size:clamp(.8rem,3vw,.95rem);white-space:nowrap;}
  .speed small{font-family:"BIZ UDPGothic";color:var(--ink-soft);min-width:2.8em;text-align:right;font-weight:700;}
  input[type=range]{-webkit-appearance:none;appearance:none;width:120px;height:12px;border-radius:8px;background:#EFE3C9;outline:none;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:26px;height:26px;border-radius:50%;background:var(--f2);border:3px solid #fff;box-shadow:0 3px 0 var(--f2d);cursor:pointer;}
  input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--f2);border:3px solid #fff;box-shadow:0 3px 0 var(--f2d);cursor:pointer;}

  .note{margin:.9rem auto 0;font-size:clamp(.68rem,2.5vw,.8rem);color:var(--ink-soft);line-height:1.7;text-align:center;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>じぶんの こえを きく</h1>
    <p class="sub">はけいを見て、録って、きいて、たしかめる</p>
  </header>

  <div class="steps"><span>①<b>はけい</b>を見る</span>・<span>②<b>ろくおん</b>する</span>・<span>③<b>きく</b></span></div>

  <div class="scopewrap">
    <canvas id="scope"></canvas>
    <div class="overlay" id="overlay">
      <p>マイクを つかいます。<br>「マイクを つかう」を おして、ゆるしてね。</p>
      <button class="start" id="startBtn">▶ マイクを つかう</button>
      <p id="errMsg" class="err hidden">マイクが つかえませんでした。<br>ブラウザの せっていを かくにんしてね。</p>
    </div>
  </div>

  <div class="row">
    <button class="btn rec" id="recBtn">● ろくおん</button>
    <span class="reclab hidden" id="recLab"><span class="recdot"></span>ろくおん中…</span>
    <button class="btn play hidden" id="playBtn">▶ きく</button>
    <button class="btn again hidden" id="againBtn">やりなおす</button>
    <span class="speed hidden" id="speedWrap"><label for="speed">はやさ</label>
      <input id="speed" type="range" min="50" max="200" step="10" value="100"><small id="speedVal">×1.0</small></span>
  </div>

  <p class="note">
    ①声を出すと はけいが うごきます。②「ろくおん」で じぶんの声を いれます。③「きく」で じぶんの声を きけます。<br>
    「はやさ」で ゆっくり／はやく きけます（ゆっくりだと 音が よく わかります）。声は この きかいの 中だけで しょりされ、そとには でません。
  </p>
</div>

<script>
/* ===== 純粋ロジック（Nodeで検証する部分） ===== */
function clampN(v,lo,hi){ return v<lo?lo:(v>hi?hi:v); }
function peak(buf){ var m=0; for(var i=0;i<buf.length;i++){ var a=buf[i]<0?-buf[i]:buf[i]; if(a>m)m=a; } return m; }
function windowSamples(ms, sr){ return Math.round(ms*sr/1000); }
function sampleToY(v, gain, h){ var y=h/2 - v*gain*(h*0.45); return y<0?0:(y>h?h:y); }
function findTrigger(buf, startOffset, negThr){
  negThr = (negThr===undefined) ? -0.02 : negThr;
  var armed=false;
  for(var i=(startOffset||0)+1; i<buf.length; i++){
    if(buf[i-1] < negThr) armed=true;
    if(armed && buf[i-1] < 0 && buf[i] >= 0) return i;
  }
  return -1;
}
function trimSilence(buf, thr, pad){
  thr = (thr===undefined) ? 0.02 : thr; pad = pad||0;
  var s=0, e=buf.length-1;
  while(s<buf.length && Math.abs(buf[s])<thr) s++;
  while(e>s && Math.abs(buf[e])<thr) e--;
  if(s>=e) return { start:0, end:buf.length };
  s=Math.max(0, s-pad); e=Math.min(buf.length, e+1+pad);
  return { start:s, end:e };
}
function concatChunks(chunks){
  var total=0, i;
  for(i=0;i<chunks.length;i++) total+=chunks[i].length;
  var out=new Float32Array(total), off=0;
  for(i=0;i<chunks.length;i++){ out.set(chunks[i], off); off+=chunks[i].length; }
  return out;
}
function computeEnvelope(buf, start, end, width){
  var mn=new Array(width), mx=new Array(width), N=end-start;
  for(var x=0;x<width;x++){
    var i0=start+Math.floor(x/width*N), i1=start+Math.floor((x+1)/width*N);
    if(i1<=i0) i1=i0+1; if(i1>end) i1=end;
    var lo=Infinity, hi=-Infinity;
    for(var i=i0;i<i1;i++){ var v=buf[i]; if(v<lo)lo=v; if(v>hi)hi=v; }
    if(lo===Infinity){ lo=0; hi=0; }
    mn[x]=lo; mx[x]=hi;
  }
  return { min:mn, max:mx };
}

if (typeof module !== 'undefined' && module.exports){
  module.exports = { clampN:clampN, peak:peak, windowSamples:windowSamples, sampleToY:sampleToY,
    findTrigger:findTrigger, trimSilence:trimSilence, concatChunks:concatChunks, computeEnvelope:computeEnvelope };
}

/* ===== ブラウザ専用 ===== */
if (typeof document !== 'undefined' && document.getElementById('scope')){
(function(){
  var cv=document.getElementById('scope'), g=cv.getContext('2d');
  var overlay=document.getElementById('overlay');
  var FFT=4096, SILENCE=0.012, WINDOW_MS=24, MAXDUR=3.0;

  var audio=null, running=false, sr=44100;
  var buf=null, gain=6, mode='live';
  var recording=false, recChunks=[], recLen=0, recorded=null, recTimer=0;
  var playing=false, playFrac=0, playToken=0, playSrc=null, rate=1.0;

  /* ---- 描画 ---- */
  function prep(){
    var dpr=window.devicePixelRatio||1, w=cv.clientWidth, h=cv.clientHeight;
    if(w===0||h===0) return null;
    cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr);
    g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,w,h);
    g.strokeStyle='#E7DAC0'; g.lineWidth=1; g.beginPath(); g.moveTo(0,h/2); g.lineTo(w,h/2); g.stroke();
    return { w:w, h:h };
  }
  function drawLive(){
    var d=prep(); if(!d) return; var w=d.w, h=d.h;
    if(!buf) return;
    var pk=peak(buf);
    if(pk < SILENCE){
      g.strokeStyle='#D8C8AB'; g.lineWidth=2; g.beginPath(); g.moveTo(0,h/2); g.lineTo(w,h/2); g.stroke();
      return;
    }
    var target=clampN(0.9/Math.max(pk,0.02),0.5,45); gain += 0.25*(target-gain);
    var win=Math.min(windowSamples(WINDOW_MS,sr), buf.length-800); if(win<64) win=64;
    var start=findTrigger(buf,0,-0.02); if(start<0 || start+win>=buf.length) start=0;
    g.strokeStyle='#EE9B3A'; g.lineWidth=3; g.lineJoin='round'; g.lineCap='round';
    g.beginPath();
    for(var x=0;x<=w;x++){ var idx=start+Math.round(x/w*win); if(idx>=buf.length) idx=buf.length-1;
      var y=sampleToY(buf[idx],gain,h); if(x===0) g.moveTo(x,y); else g.lineTo(x,y); }
    g.stroke();
  }
  function drawRecorded(pFrac){
    var d=prep(); if(!d) return; var w=d.w, h=d.h;
    if(!recorded || recorded.length===0) return;
    var pk=peak(recorded), gg=clampN(0.9/Math.max(pk,0.02),0.5,45);
    var env=computeEnvelope(recorded,0,recorded.length,w);
    g.strokeStyle='#EE9B3A'; g.lineWidth=1;
    for(var x=0;x<w;x++){ var y0=sampleToY(env.max[x],gg,h), y1=sampleToY(env.min[x],gg,h);
      if(y1<y0+1)y1=y0+1; g.beginPath(); g.moveTo(x+0.5,y0); g.lineTo(x+0.5,y1); g.stroke(); }
    var durMs=Math.round(recorded.length/sr*1000);
    g.fillStyle='#B6A88F'; g.font='11px "BIZ UDPGothic",sans-serif';
    g.textAlign='left';  g.fillText('0 ms',4,h-6);
    g.textAlign='right'; g.fillText(durMs+' ms',w-4,h-6);
    if(pFrac!=null && pFrac>=0 && pFrac<=1){ var px=pFrac*w; g.strokeStyle='#4E9E3E'; g.lineWidth=2;
      g.beginPath(); g.moveTo(px,0); g.lineTo(px,h); g.stroke(); }
  }
  function drawFrame(){ if(mode==='recorded') drawRecorded(playing?playFrac:null); else drawLive(); }

  function loop(){
    if(running && mode==='live' && buf){
      if(audio.analyser.getFloatTimeDomainData) audio.analyser.getFloatTimeDomainData(buf);
      else { var b=new Uint8Array(buf.length); audio.analyser.getByteTimeDomainData(b);
             for(var i=0;i<b.length;i++) buf[i]=(b[i]-128)/128; }
      drawLive();
    }
    requestAnimationFrame(loop);
  }

  /* ---- 録音 ---- */
  function onRecAudio(ev){
    if(!recording) return;
    var ch=ev.inputBuffer.getChannelData(0);
    recChunks.push(new Float32Array(ch)); recLen += ch.length;
    if(recLen/sr >= MAXDUR) stopRecording();
  }
  function startRecording(){
    if(!running) return;
    resumeCtx();
    stopPlayback();
    recording=true; recChunks=[]; recLen=0; mode='live'; recorded=null;
    updateUI();
    if(recTimer) clearTimeout(recTimer);
    recTimer=setTimeout(function(){ if(recording) stopRecording(); }, Math.round(MAXDUR*1000)+300);
  }
  function stopRecording(){
    if(!recording) return;
    recording=false; if(recTimer){ clearTimeout(recTimer); recTimer=0; }
    var all=concatChunks(recChunks);
    var tr=trimSilence(all, 0.02, Math.round(0.04*sr));
    if(peak(all) < 0.02 || tr.end-tr.start < Math.round(0.05*sr)){
      recorded=null; mode='live'; updateUI();
      return;
    }
    recorded=all.slice(tr.start, tr.end);
    mode='recorded';
    updateUI(); drawFrame();
  }

  /* ---- 再生 ---- */
  function playRecorded(){
    if(!recorded || !audio) return;
    resumeCtx();
    stopPlayback();
    var token=++playToken;
    var b=audio.ctx.createBuffer(1, recorded.length, sr); b.getChannelData(0).set(recorded);
    var src=audio.ctx.createBufferSource(); src.buffer=b; src.playbackRate.value=rate; src.connect(audio.ctx.destination);
    playSrc=src; playing=true;
    var t0=audio.ctx.currentTime, effDur=(recorded.length/sr)/rate;
    src.onended=function(){ if(token===playToken){ playing=false; playFrac=0; drawFrame(); } };
    try{ src.start(); }catch(e){}
    (function pl(){ if(token!==playToken || !playing) return;
      var f=(audio.ctx.currentTime-t0)/effDur;
      if(f>=1){ playFrac=1; drawFrame(); return; }
      playFrac=f<0?0:f; drawFrame(); requestAnimationFrame(pl);
    })();
  }
  function stopPlayback(){
    playToken++; playing=false; playFrac=0;
    if(playSrc){ try{ playSrc.onended=null; playSrc.stop(); }catch(e){} playSrc=null; }
  }
  function again(){
    stopPlayback(); recorded=null; mode='live'; updateUI();
  }

  function updateUI(){
    var recBtn=document.getElementById('recBtn'), recLab=document.getElementById('recLab');
    var playBtn=document.getElementById('playBtn'), againBtn=document.getElementById('againBtn');
    var speedWrap=document.getElementById('speedWrap');
    recBtn.textContent = recording ? '■ とめる' : '● ろくおん';
    recLab.classList.toggle('hidden', !recording);
    var isRec = (mode==='recorded' && !recording);
    playBtn.classList.toggle('hidden', !isRec);
    againBtn.classList.toggle('hidden', !isRec);
    speedWrap.classList.toggle('hidden', !isRec);
  }
  document.getElementById('speed').addEventListener('input', function(){
    rate=parseInt(this.value,10)/100;
    document.getElementById('speedVal').textContent='×'+rate.toFixed(1);
  });

  /* ---- 起動 ---- */
  function resumeCtx(){ if(audio && audio.ctx && audio.ctx.state==='suspended'){ try{ audio.ctx.resume(); }catch(e){} } }
  function start(){
    var errMsg=document.getElementById('errMsg'); errMsg.classList.add('hidden');
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ errMsg.classList.remove('hidden'); return; }
    var Ctor=window.AudioContext||window.webkitAudioContext;
    if(!Ctor){ errMsg.classList.remove('hidden'); return; }
    var ctx;
    try{ ctx=new Ctor(); }catch(e){ errMsg.classList.remove('hidden'); return; }
    if(ctx.state==='suspended'){ try{ ctx.resume(); }catch(e){} }   /* iOS：ユーザー操作の中で 生成・再開する */
    navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}})
      .then(function(stream){
        sr=ctx.sampleRate;
        var source=ctx.createMediaStreamSource(stream);
        var analyser=ctx.createAnalyser(); analyser.fftSize=FFT; analyser.smoothingTimeConstant=0;
        source.connect(analyser);
        buf=new Float32Array(analyser.fftSize);
        var recProc=ctx.createScriptProcessor(4096,1,1);
        var zeroGain=ctx.createGain(); zeroGain.gain.value=0;
        recProc.onaudioprocess=onRecAudio;
        source.connect(recProc); recProc.connect(zeroGain); zeroGain.connect(ctx.destination);
        audio={ctx:ctx,source:source,analyser:analyser,recProc:recProc,stream:stream};
        running=true; mode='live'; overlay.classList.add('hidden'); updateUI();
      })
      .catch(function(){ errMsg.classList.remove('hidden'); });
  }

  document.getElementById('startBtn').addEventListener('click', start);
  document.getElementById('recBtn').addEventListener('click', function(){
    if(!running) return; if(recording) stopRecording(); else startRecording();
  });
  document.getElementById('playBtn').addEventListener('click', playRecorded);
  document.getElementById('againBtn').addEventListener('click', again);

  var ro=('ResizeObserver' in window)?new ResizeObserver(function(){ drawFrame(); }):null;
  if(ro) ro.observe(cv); window.addEventListener('resize', drawFrame);
  requestAnimationFrame(function(){ drawFrame(); requestAnimationFrame(loop); });
})();
}
</script>
</body>
</html>
